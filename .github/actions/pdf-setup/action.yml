name: PDF build setup
description: >
  Shared setup for every workflow that builds Little Chewz PDFs: Python,
  requirements.txt, source validation, and tool tests. Fonts are bundled in
  templates/, so nothing is installed system-wide. Run
  actions/checkout before this step.
inputs:
  extra-packages:
    description: Additional pip packages for this workflow only (space-separated)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install PDF dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        python -m pip install -r requirements.txt
        if [ -n "$EXTRA_PACKAGES" ]; then
          python -m pip install $EXTRA_PACKAGES
        fi

    - name: Validate source references
      shell: bash
      run: python scripts/validate.py

    - name: Test build tooling
      shell: bash
      run: python -m unittest discover -s tests -v
