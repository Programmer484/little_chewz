name: Publish Directly

# Temporary internal fallback until merge-trigger publication exists.
# Builds one live/pending registry entry from main and replaces its
# Drive file in place (same file ID and link; Drive keeps the old version).
on:
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Registry ID to publish (for example ccc-q01-welcome)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and check Drive access without uploading"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-to-drive
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.resource_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publishing runs only from main (got ${GITHUB_REF})." >&2
          exit 1

      - name: Check out main
        uses: actions/checkout@v5

      - name: Shared PDF setup, validation, and tests
        uses: ./.github/actions/pdf-setup
        with:
          extra-packages: "google-api-python-client>=2.100,<3 google-auth>=2.20,<3"

      - name: Build and publish
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESOURCE_ID: ${{ inputs.resource_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/publish_to_drive.py "$RESOURCE_ID" --dry-run --expected-revision "$GITHUB_SHA" --result-json publication-report.json
          else
            python scripts/publish_to_drive.py "$RESOURCE_ID" --expected-revision "$GITHUB_SHA" --result-json publication-report.json
          fi

      - name: Upload the published PDF as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.resource_id }}-pdf
          path: exports/publish/*.pdf
          retention-days: 30

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.resource_id }}-publication-report
          path: publication-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Record published status
        if: ${{ !inputs.dry_run }}
        env:
          RESOURCE_ID: ${{ inputs.resource_id }}
        run: |
          if git diff --quiet -- catalog/resources.json; then
            echo "No status change to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/resources.json
          git commit -m "Mark ${RESOURCE_ID} published after verified Drive replacement"
          git push origin HEAD:main
