name: One-time approved Chew/Plate Drive publication

# Only the exact human-authorized release branch and commit message can publish.
# This is not a merge, scheduled, or generic push publisher.
on:
  push:
    branches:
      - release/approved-chew-plate-20261105

permissions:
  contents: write

concurrency:
  group: approved-chew-plate-drive-publication-20261105
  cancel-in-progress: false

jobs:
  publish-reviewed:
    if: github.event.head_commit.message == 'Execute one-time approved Chew/Plate Drive publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact authorized revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate and test PDF tooling
        uses: ./.github/actions/pdf-setup
        with:
          extra-packages: 'google-api-python-client>=2.100,<3 google-auth>=2.20,<3'

      - name: Preflight all five targets and reviewed Print Pack URLs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          from publish_to_drive import load_registry, drive_service, check_entry, check_destination
          from publication_checks import unpublished_dependencies
          from select_builds import targets

          registry = load_registry()
          expected = {
              'ccc-q01-chew-on-this-teacher-guide': '17AA9YPJ48Bzkst6QfseOGTIVKP3gA21e',
              'ccc-q01-chew-on-this-team-talk-questions': '1J6cOCs_wkZuwc3OKoT3cZaJYr-MuFuFO',
              'ccc-q01-chew-on-this-role-play-extension': '1C8CUewj5Gi9ye8AQfzoohZTVEVmfGipg',
              'ccc-q01-chew-on-this-graffiti-wall': '1BK4xqEReQ0NBoxC40YV7IOGd9p_D5ARE',
              'ccc-q01-plate-it-forward-teacher-guide': '1Oy0IqEoZBN51YlkDK9A8nq12fcA0FORv',
          }
          for rid in ['ccc-q01-chew-on-this-print-pack', 'ccc-q01-plate-it-forward-print-pack']:
              entry = registry[rid]
              expected_url = 'https://print.littlechewz.workers.dev/lesson/' + rid.removesuffix('-print-pack')
              if entry.get('published_url') != expected_url or entry.get('human_reviewed_url') != expected_url:
                  raise RuntimeError(f'{rid}: human-reviewed URL does not match intended lesson route')
          service = drive_service()
          source_targets = targets()
          for rid, file_id in expected.items():
              actual_id, _ = check_entry(rid, registry[rid])
              if actual_id != file_id:
                  raise RuntimeError(f'{rid}: established Drive ID has changed')
              blocked = unpublished_dependencies(rid, registry, source_targets)
              if blocked:
                  raise RuntimeError(f'{rid}: unpublished dependencies: {blocked}')
              meta = check_destination(service, file_id)
              if meta.get('id') != file_id:
                  raise RuntimeError(f'{rid}: Drive destination mismatch')
              print(f'Preflight OK: {rid} -> {file_id}')
          PY

      - name: Publish exact approved generated PDFs and verify Drive checksums
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-results
          for id in \
            ccc-q01-chew-on-this-team-talk-questions \
            ccc-q01-chew-on-this-role-play-extension \
            ccc-q01-chew-on-this-graffiti-wall \
            ccc-q01-chew-on-this-teacher-guide \
            ccc-q01-plate-it-forward-teacher-guide; do
            python scripts/publish_to_drive.py "$id" \
              --expected-revision "$GITHUB_SHA" \
              --result-json "publication-results/$id.json"
          done

      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verified-chew-plate-publication-evidence
          path: |
            publication-results/*.json
            catalog/resources.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit only verified PDF checksum metadata
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/resources.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified Chew/Plate published PDF checksums'
          git push origin HEAD:refs/heads/release/approved-chew-plate-20261105
