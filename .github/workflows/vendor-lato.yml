name: Vendor Lato (temporary)

# One-off: copies the exact Lato files CI renders with (Ubuntu fonts-lato) into the
# repository. Removed in the next commit.
on:
  push:
    branches: [system/agent-instructions-and-renderer]
    paths: [".github/workflows/vendor-lato.yml"]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Copy fonts and licence
        run: |
          if [ ! -f /usr/share/fonts/truetype/lato/Lato-Regular.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-lato
          fi
          mkdir -p templates/fonts
          for s in Regular Medium Semibold Bold Heavy Italic; do
            cp "/usr/share/fonts/truetype/lato/Lato-$s.ttf" templates/fonts/
          done
          cp /usr/share/doc/fonts-lato/copyright templates/fonts/OFL-Lato.txt
          dpkg-query -W fonts-lato > templates/fonts/lato-version.txt || echo "preinstalled" > templates/fonts/lato-version.txt
          sha256sum templates/fonts/*.ttf
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/fonts
          git commit -m "Vendor Lato from Ubuntu fonts-lato (same files CI renders with)"
          git push origin HEAD:system/agent-instructions-and-renderer
