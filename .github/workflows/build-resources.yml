name: PDF previews

# One run per relevant PR update, plus manual runs.
# Deliberately no main push trigger: avoid a duplicate billed run after merge.
on:
  pull_request:
    paths:
      - ".github/workflows/build-resources.yml"
      - "content/**"
      - "scripts/**"
      - "schemas/**"
      - "templates/**"
      - "system/**"
      - "catalog/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approved-pdfs:
    name: Validate and render approved PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PDF dependencies and Lato fonts
        run: |
          python -m pip install -r requirements.txt
          if [ ! -f /usr/share/fonts/truetype/lato/Lato-Regular.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-lato
          fi

      - name: Validate source references
        run: python scripts/validate.py

      - name: Test dependency selector
        run: python -m unittest discover -s tests -v

      - name: Determine affected PDF outputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/select_builds.py --all --output build-selection.json
          else
            # Explicit base SHA allows precise comparisons even when a PR has
            # multiple commits; fail rather than silently skipping changes.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
            mapfile -t changed < /tmp/changed-files.txt
            python scripts/select_builds.py --base-ref "$BASE_SHA" --changed "${changed[@]}" --output build-selection.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          outputs = json.loads(Path("build-selection.json").read_text())["outputs"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_outputs={'true' if outputs else 'false'}\n")
          summary = "Targeted PDF previews: " + (", ".join(outputs) if outputs else "none; validation only")
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### " + summary + "\n")
          PY

      - name: Render and verify only affected PDFs
        if: steps.select.outputs.has_outputs == 'true'
        run: python scripts/build_selected.py --manifest build-selection.json

      - name: Attach PDFs for review (7 days)
        if: steps.select.outputs.has_outputs == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: little-chewz-approved-pdf-previews
          path: exports/*.pdf
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publish browser-viewable PDF previews
        if: steps.select.outputs.has_outputs == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Each PR owns a separate disposable preview branch; main is untouched.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            preview_branch="pdf-preview-manual"
          else
            preview_branch="pdf-preview-pr-$PR_NUMBER"
          fi

          temp_dir="$(mktemp -d)"
          cp exports/*.pdf "$temp_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$preview_branch"
          git rm -rf --quiet .
          mkdir -p previews
          cp "$temp_dir"/*.pdf previews/
          git add -f previews/*.pdf
          git commit -m "Preview generated PDFs for ${preview_branch}"
          # Force-push only this dedicated, generated preview branch.
          git push --force origin "HEAD:refs/heads/$preview_branch"

          {
            echo "### Open PDFs directly in GitHub"
            for pdf in previews/*.pdf; do
              name="${pdf##*/}"
              echo "- [Preview ${name}](https://github.com/${REPO}/blob/${preview_branch}/${pdf})"
            done
            echo ""
            echo "These are unapproved review copies on a temporary-purpose branch, not published teacher resources."
          } >> "$GITHUB_STEP_SUMMARY"
