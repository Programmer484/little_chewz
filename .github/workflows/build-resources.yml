name: PDF previews

# PR updates and main merges validate; main runs show consolidated AI edits.
# Each PDF run gets a permanent directory on one shared preview-history branch.
on:
  pull_request:
    paths:
      - ".github/workflows/build-resources.yml"
      - ".github/actions/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "system/**"
      - "catalog/**"
      - "requirements.txt"
      - "*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-resources.yml"
      - ".github/actions/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "system/**"
      - "catalog/**"
      - "requirements.txt"
      - "*.md"
  workflow_dispatch:
    inputs:
      document:
        description: "PDF filename to preview, or all"
        required: true
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: pdf-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pdf-previews:
    name: Validate and render affected PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v5

      - name: Shared PDF setup, validation, and tests
        uses: ./.github/actions/pdf-setup

      - name: Determine affected PDF outputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCUMENT: ${{ inputs.document }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/select_builds.py --document "$DOCUMENT" --output build-selection.json
          else
            # Explicit base SHA allows precise comparisons even when a PR has
            # multiple commits; fail rather than silently skipping changes.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
            mapfile -t changed < /tmp/changed-files.txt
            python scripts/select_builds.py --base-ref "$BASE_SHA" --changed "${changed[@]}" --output build-selection.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          outputs = json.loads(Path("build-selection.json").read_text())["outputs"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_outputs={'true' if outputs else 'false'}\n")
          summary = "Targeted PDF previews: " + (", ".join(outputs) if outputs else "none; validation only")
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### " + summary + "\n")
          PY

      - name: Render and verify only affected PDFs
        if: steps.select.outputs.has_outputs == 'true'
        run: python scripts/build_selected.py --manifest build-selection.json

      - name: Attach PDFs for review (7 days)
        if: steps.select.outputs.has_outputs == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: little-chewz-pdf-previews
          path: exports/*.pdf
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publish browser-viewable PDF previews
        if: steps.select.outputs.has_outputs == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # This step switches to the history branch. Restore the original commit on exit so
          # later post steps (for example the shared .github/actions/pdf-setup) still find their files.
          original_head="$(git rev-parse HEAD)"
          trap 'git checkout --quiet --force "$original_head"' EXIT
          # A single branch avoids branch proliferation; every run has its own immutable folder.
          # Existing pdf-preview-run-* branches and URLs are deliberately left untouched.
          preview_branch="pdf-preview-history"
          run_folder="previews/${RUN_ID}"

          temp_dir="$(mktemp -d)"
          cp exports/*.pdf "$temp_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # PR and main jobs can complete concurrently. Retry an append if the
          # shared history branch advances between fetch and push.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git ls-remote --exit-code --heads origin "$preview_branch" >/dev/null; then
              git fetch --no-tags origin "$preview_branch"
              git checkout -B "$preview_branch" FETCH_HEAD
            else
              git checkout --orphan "${preview_branch}-init-${RUN_ID}-${attempt}"
              git rm -rf --quiet .
            fi

            if [[ -e "$run_folder" ]]; then
              echo "::error::Preview folder for this run already exists: $run_folder"
              exit 1
            fi
            mkdir -p "$run_folder"
            cp "$temp_dir"/*.pdf "$run_folder/"
            git add -f "$run_folder"/*.pdf
            git commit -m "PDF previews for Actions run ${RUN_ID}"

            if git push origin "HEAD:refs/heads/$preview_branch"; then
              break
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "::error::Failed to append PDFs to history after retries"
              exit 1
            fi
            sleep "$attempt"
          done

          {
            echo "### PDF review links"
            echo "**Primary review link:** [This Actions run](https://github.com/${REPO}/actions/runs/${RUN_ID})"
            echo ""
            echo "Open PDFs directly in GitHub:"
            for pdf in "$run_folder"/*.pdf; do
              name="${pdf##*/}"
              echo "- [Preview ${name}](https://github.com/${REPO}/blob/${preview_branch}/${pdf})"
            done
            echo ""
            echo "These PDFs are review copies; they are not published teacher resources."
          } >> "$GITHUB_STEP_SUMMARY"

  publication-inspection-live-test:
    name: Verify production catalogue with read-only Drive inspection
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'test/live-inspection-acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pdf-setup
        with:
          extra-packages: "google-api-python-client>=2.100,<3 google-auth>=2.20,<3"
      - name: Read-only live publication inspection
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python scripts/inspect_publications.py --report live-all-publications.json
          python - <<'PY'
          import json
          from collections import Counter
          data=json.load(open("live-all-publications.json"))
          assert data["read_only"] is True
          resources=data["resources"]
          assert len(resources)==29, len(resources)
          welcome=next(v for v in resources if v["resource_id"]=="ccc-q01-welcome")
          assert welcome["result"]=="verified", welcome
          assert welcome["content_parity"]=="verified", welcome
          print("LIVE READ-ONLY INSPECTION:",dict(Counter(v["result"] for v in resources)))
          print("WELCOME:",welcome)
          PY
      - name: Retain read-only inspection report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-read-only-inspection
          path: live-all-publications.json
          if-no-files-found: ignore
          retention-days: 7
