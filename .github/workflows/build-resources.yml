name: PDF previews

# One run per relevant PR update, plus manual runs.
# Deliberately no main push trigger: avoid a duplicate billed run after merge.
on:
  pull_request:
    paths:
      - ".github/workflows/build-resources.yml"
      - "content/**"
      - "scripts/**"
      - "schemas/**"
      - "templates/**"
      - "system/**"
      - "catalog/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approved-pdfs:
    name: Validate and render approved PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF dependencies and Lato fonts
        run: |
          python -m pip install -r requirements.txt
          if [ ! -f /usr/share/fonts/truetype/lato/Lato-Regular.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-lato
          fi

      - name: Validate source references
        run: python scripts/validate.py

      - name: Render approved Activate guide
        run: |
          python scripts/build.py teacher --lesson content/confetti-cake-cottage/quest-01-bake-off-betrayal/lessons/00-activate/lesson.json

      - name: Render approved teacher companions
        shell: bash
        run: |
          mkdir -p exports
          python scripts/renderers/teacher_companion.py \
            content/confetti-cake-cottage/quest-01-bake-off-betrayal/resources/teacher_companion/mission-video-questions.json \
            -o exports/mission-video-questions.pdf --registry catalog/resources.json
          python scripts/renderers/teacher_companion.py \
            content/confetti-cake-cottage/quest-01-bake-off-betrayal/resources/teacher_companion/confetti-file-questions.json \
            -o exports/confetti-file-questions.pdf --registry catalog/resources.json

      - name: Check generated PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          outputs = sorted(Path("exports").glob("*.pdf"))
          assert {p.name for p in outputs} == {
              "00-activate-teacher-guide.pdf",
              "mission-video-questions.pdf",
              "confetti-file-questions.pdf",
          }, f"Unexpected PDF outputs: {outputs}"
          for path in outputs:
              with fitz.open(path) as doc:
                  assert doc.page_count >= 1, f"Empty PDF: {path}"
                  links = [link for page in doc for link in page.get_links()]
                  for link in links:
                      if link["kind"] == fitz.LINK_URI:
                          assert link.get("uri", "").startswith("https://"), (
                              f"Unsupported external link in {path}: {link}"
                          )
                  if path.name == "00-activate-teacher-guide.pdf":
                      assert any(link["kind"] == fitz.LINK_URI for link in links), (
                          "Activate Teacher Guide lost its resource hyperlinks"
                      )
                  print(f"PASS {path}: {doc.page_count} pages, {len(links)} links, {path.stat().st_size} bytes")
          PY

      - name: Attach PDFs for review (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: little-chewz-approved-pdf-previews
          path: exports/*.pdf
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
