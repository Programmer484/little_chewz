name: Inspect published resources

# Read-only, manually triggered. Unpublished material is intentionally skipped.
on:
  workflow_dispatch:
    inputs:
      resource_id:
        description: "Optional published resource ID; blank audits every published resource"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Drive sharing / Human review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepare audit tools
        uses: ./.github/actions/pdf-setup
        with:
          extra-packages: "google-api-python-client>=2.100,<3 google-auth>=2.20,<3"

      - name: Inspect Drive sharing and human-review links
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESOURCE_ID: ${{ inputs.resource_id }}
        run: |
          if [[ -n "$RESOURCE_ID" ]]; then
            python scripts/inspect_publications.py --resource-id "$RESOURCE_ID" --report inspection-report.json
          else
            python scripts/inspect_publications.py --report inspection-report.json
          fi

      - name: Retain full report even when an audit fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publication-inspection
          path: |
            inspection-report.json
            inspection-report.txt
          if-no-files-found: ignore
          retention-days: 30
