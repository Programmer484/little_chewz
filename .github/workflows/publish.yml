name: Publish

# Replaces established generated-PDF Drive files in place (same file ID, link,
# folder and sharing; Drive keeps the old version). Two explicit triggers only:
#   - Actions -> Publish -> Run workflow, naming resource IDs (dry run by default).
#   - Merging a PR into main that added .github/resource-releases/<PR>.json.
# Ordinary merges without a marker never publish. See system/PUBLISH.md.
on:
  workflow_dispatch:
    inputs:
      resource_ids:
        description: "Resource IDs to publish, in order (space or comma separated)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and check Drive access without uploading"
        required: true
        default: true
        type: boolean
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: little-chewz-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Publishing runs only from main (got ${GITHUB_REF})." >&2
          exit 1

      - name: Find the release marker added by the merged PR
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          marker=".github/resource-releases/${PR_NUMBER}.json"
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[] | select(.status != "removed") | .filename' | grep -Fxq "$marker"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "marker=$marker" >> "$GITHUB_OUTPUT"
          else
            echo "No release marker in PR #${PR_NUMBER}; nothing to publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the accepted revision
        if: steps.request.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Shared PDF setup, validation, and tests
        if: steps.request.outputs.enabled == 'true'
        uses: ./.github/actions/pdf-setup
        with:
          extra-packages: "google-api-python-client>=2.100,<3 google-auth>=2.20,<3"

      - name: Build and publish
        id: execute
        if: steps.request.outputs.enabled == 'true'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESOURCE_IDS: ${{ inputs.resource_ids }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MARKER: ${{ steps.request.outputs.marker }}
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          args=(--expected-revision "$revision" --result-json publication-report.json)
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          if [[ -n "$MARKER" ]]; then
            python scripts/publish_to_drive.py --marker "$MARKER" "${args[@]}"
          else
            python scripts/publish_to_drive.py $RESOURCE_IDS "${args[@]}"
          fi

      - name: Record verified checksums on main
        id: persist
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/resources.json; then
            echo "No publication record changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/resources.json
          git commit -m "Record verified Drive publication from run ${GITHUB_RUN_ID}"
          # Replay onto the latest main; never force or overwrite another merge.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Summarize outcome
        if: always() && steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          if [[ -f publication-report.json ]]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("| Resource | Result | Drive file |\n| --- | --- | --- |")
          for r in json.load(open("publication-report.json")):
              rid = r.get("resource_id") or ", ".join(r.get("resource_ids", []))
              print(f"| {rid} | {r.get('result')} {r.get('error', '')} | {r.get('file_id', '')} |")
          EOF
          else
            echo "No publication report; inspect the steps before assuming success." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report and published PDFs
        if: always() && steps.request.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: publication-${{ github.run_id }}
          path: |
            publication-report.json
            exports/publish/*.pdf
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail on a blocked or unsaved publication
        if: always() && steps.request.outputs.enabled == 'true'
        env:
          EXEC_RESULT: ${{ steps.execute.outcome }}
          PERSIST_RESULT: ${{ steps.persist.outcome }}
        run: |
          if [[ "$EXEC_RESULT" != "success" || "$PERSIST_RESULT" != "success" ]]; then
            echo "::error::Publication failed or its checksum record was not saved; read the report."
            exit 1
          fi
